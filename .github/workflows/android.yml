name: Compilar Efoto

# Compila el APK de depuración en la nube. Dos formas de descargarlo:
#   - Releases -> "Efoto (última compilación)" -> app-debug.apk  (directo desde el teléfono)
#   - Actions -> (última ejecución) -> Artifacts -> Efoto-debug-apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # para publicar el APK en Releases

jobs:
  apk:
    name: APK de depuración
    # Versión fija: ubuntu-latest cambia de imagen y puede romper la instalación del SDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: SDK, NDK y CMake
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:-<sin definir>}"
          SDKM="${ANDROID_HOME:-/nonexistent}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "La imagen no trae las herramientas de Android: se descargan."
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Los errores quedan como anotaciones visibles en la ejecución (y por la API pública).
          python3 .github/scripts/annotate.py build.log
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: Efoto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "Efoto (última compilación)" \
            --notes "APK de depuración compilado automáticamente del commit ${GITHUB_SHA::7}. Instálalo en el teléfono (hay que permitir apps de origen desconocido)." \
            --target "$GITHUB_SHA"

  nativo:
    name: Pruebas del motor (C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y cmake zlib1g-dev python3
      - name: Compilar y probar
        run: |
          cmake -S native-tests -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests -j4
          ctest --test-dir build-tests --output-on-failure
